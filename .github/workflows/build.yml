name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  # 코어 회계 로직 검증 — 기기 사양과 무관하게 항상 돈다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (headless)
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          sudo install -m755 "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Logic tests
        run: godot --headless --path . -s res://tests/test_core.gd

  # APK 빌드 — 로컬 기기 부담 없이 클라우드에서만 수행
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          sudo install -m755 "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz"
          if [ -d templates ]; then
            mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          else
            mv ./* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" || true
          fi
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" | head

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/timeloan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: timeloan-apk
          path: build/timeloan.apk
          retention-days: 14
